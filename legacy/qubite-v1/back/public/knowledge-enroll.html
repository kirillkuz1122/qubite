<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создание аккаунта · Qubite</title><link rel="stylesheet" href="/front/css/styles.css"><link rel="stylesheet" href="/front/auth.css"><script defer src="/knowledge-enroll.js"></script></head><body data-auth-surface="true"><main class="glass-panel auth-services"><h1 id="title">Qubite · Создание аккаунта</h1><p id="intro">Проверяем выданный тебе доступ…</p><form id="enroll" class="modal__form" hidden><label class="field">Логин<input class="input" id="login" readonly autocomplete="username"></label><label class="field">Придумай пароль<input class="input" id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><label class="field">Повтори пароль<input class="input" id="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><p>От 8 символов до 72 байт UTF-8, латинская буква и цифра, без пробелов. Первый пароль закрепится за аккаунтом. Позже его можно менять только через обычные настройки приложения.</p><button class="btn btn--accent" id="submit">Создать аккаунт</button></form><p id="status" role="status"></p><a class="btn btn--accent" id="open" hidden>Открыть сервис</a><a class="btn btn--muted" href="/auth">Qubite Auth</a></main></body></html>
