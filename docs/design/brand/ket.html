<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:T5;src:url(../fonts/Tiny5-latin.woff2)}
@font-face{font-family:T5;src:url(../fonts/Tiny5-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Fira;src:url(../fonts/FiraCode-Regular-latin.woff2)}
@font-face{font-family:Fira;src:url(../fonts/FiraCode-Regular-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Fira;font-weight:600;src:url(../fonts/FiraCode-SemiBold-latin.woff2)}
@font-face{font-family:Fira;font-weight:600;src:url(../fonts/FiraCode-SemiBold-cyrillic.woff2);unicode-range:U+0400-045F}
body{margin:0;background:#100f0d}</style></head><body><canvas id=c></canvas>
<script>
const INK='#f3ede3',OR='#ff9852',BG='#100f0d',PANEL='#1b1916',MUTE='#a59c90',PAPER='#f3eee5',DARK='#1f1a17';
// кет |•⟩: черта, точка, угловая скобка; поле 9×7 клеток
let ROWS,CELLS,QC,DOT,NW;
function setKet(k){ROWS=k==='q'?['x.....x...','x..xx..x..','x.x.x...x.','x.x.x....x','x..xx...x.','x...o..x..','x...o.x...']:['x....x...','x.....x..','x......x.','x.......x','x......x.','x.....x..','x....x...'];
  NW=ROWS[0].length;CELLS=[];QC=[];ROWS.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='x')CELLS.push([x,y]);if(c==='o')QC.push([x,y]);}));DOT=k==='q'?null:{x:3.1,y:3,s:2.5};}
setKet('dot');window.setKet=setKet;
function rr(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,Math.max(0,r));g.fill();}
// mode: dots | pixel | solid; center: round | square
function mark(g,X,Y,S,mode='dots',center='round',ink=INK,acc=OR){
  const p=S/NW,oy=Y+(S-7*p)/2,ox=X,b0=NW-4;
  if(mode==='solid'){const t=p*0.95;g.strokeStyle=ink;g.lineWidth=t;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(ox+p/2,oy+p/2);g.lineTo(ox+p/2,oy+6.5*p);g.stroke();
    g.beginPath();g.moveTo(ox+(b0+.5)*p,oy+p/2);g.lineTo(ox+(b0+3.5)*p,oy+3.5*p);g.lineTo(ox+(b0+.5)*p,oy+6.5*p);g.stroke();
    if(!DOT){g.lineWidth=t*.95;g.beginPath();g.ellipse(ox+3.5*p,oy+2.5*p,1.05*p,1.3*p,0,0,7);g.stroke();g.strokeStyle=acc;g.beginPath();g.moveTo(ox+4.55*p,oy+2.6*p);g.lineTo(ox+4.55*p,oy+6.5*p);g.stroke();}}
  else{const s=p*(mode==='dots'?.9:.88),rad=mode==='dots'?s/2:s*.08;CELLS.forEach(([x,y])=>rr(g,ox+x*p+(p-s)/2,oy+y*p+(p-s)/2,s,s,rad,ink));QC.forEach(([x,y])=>rr(g,ox+x*p+(p-s)/2,oy+y*p+(p-s)/2,s,s,rad,acc));}
  if(!DOT)return;
  const d=DOT.s*p*(mode==='solid'?.95:.92),cx=ox+DOT.x*p+p/2,cy=oy+DOT.y*p+p/2;
  rr(g,cx-d/2,cy-d/2,d,d,center==='round'?d/2:(mode==='pixel'?d*.06:d*.18),acc);
}
function bgdots(g,W,H,a=.05,col='243,237,227'){g.fillStyle=`rgba(${col},${a})`;for(let y=10;y<H;y+=20)for(let x=10;x<W;x+=20){g.beginPath();g.arc(x,y,1.1,0,7);g.fill();}}
function card(g,x,y,w,h,r=32,fill=PANEL){rr(g,x,y,w,h,r,fill);g.strokeStyle='rgba(243,237,227,.12)';g.lineWidth=1.5;g.beginPath();g.roundRect(x,y,w,h,r);g.stroke();}
function txt(g,t,x,y,font,col){g.font=font;g.fillStyle=col;g.fillText(t,x,y);}
window.variants=()=>{const W=1400,H=900,c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=BG;g.fillRect(0,0,W,H);bgdots(g,W,H);
  txt(g,window.KTITLE||'кет |•⟩ — по центру квадрата',70,90,'44px T5',INK);
  txt(g,window.KSUB||'левая черта ближе к точке. сверху — круглая точка, снизу — квадрат',70,130,'18px Fira',MUTE);
  ['точки','пиксели','сплошной'].forEach((m,i)=>txt(g,m,190+i*330,880,'16px Fira',MUTE));
  [['round','круглая'],['square','квадрат']].forEach(([cn,label],j)=>{txt(g,label,40,330+j*330,'16px Fira',MUTE);
    ['dots','pixel','solid'].forEach((m,i)=>{const x=130+i*330,y=180+j*330;card(g,x,y,280,280);mark(g,x+50,y+50,180,m,cn);});});
  // светлая тема и инверсия
  card(g,1120,180,240,280,32,PAPER);mark(g,1160,250,160,'dots','round',DARK,'#f7883e');txt(g,'светлая',1150,500,'16px Fira',MUTE);
  card(g,1120,510,240,280,32,OR);mark(g,1160,580,160,'dots','round',BG,PAPER);txt(g,'на оранжевом',1150,830,'16px Fira',MUTE);
};
window.mockups=()=>{const W=1800,H=1150,c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=BG;g.fillRect(0,0,W,H);bgdots(g,W,H);
  txt(g,'как выглядит в жизни',70,90,'44px T5',INK);
  // 1. телефон: иконка на рабочем столе
  card(g,70,150,360,700,48,'#2a2622');rr(g,90,170,320,660,36,'#3b3530');
  const ic=[['#71cfff'],['#90dea5'],['#ffe163'],['#ffb98a'],['#a59c90'],['#5c5650'],['#71cfff'],['#90dea5']];
  for(let i=0;i<12;i++){const x=115+(i%4)*72,y=220+Math.floor(i/4)*100;
    if(i===5){rr(g,x,y,58,58,14,BG);mark(g,x+8,y+8,42,'dots','round');txt(g,'Qubite',x+2,y+76,'13px Fira',INK);}
    else{rr(g,x,y,58,58,14,ic[i%8][0]);g.globalAlpha=.35;rr(g,x+16,y+16,26,26,8,'#fff');g.globalAlpha=1;}}
  txt(g,'иконка приложения',150,890,'16px Fira',MUTE);
  // 2. telegram: аватар-кружок в списке чатов
  card(g,470,150,460,320,28);
  [['Qubite','Через 15 минут: повторить графы',true],['Мама','ок',false],['Класс 10Б','ДЗ на завтра…',false]].forEach(([n,m,me],i)=>{const y=180+i*95;
    g.save();g.beginPath();g.arc(530,y+35,32,0,7);g.clip();rr(g,498,y+3,64,64,0,me?BG:['#5c5650','#71cfff','#90dea5'][i]);if(me)mark(g,503,y+8,54,'dots','round');g.restore();
    txt(g,n,580,y+28,'600 18px Fira',INK);txt(g,m,580,y+54,'15px Fira',MUTE);});
  txt(g,'аватар бота в Telegram',560,500,'16px Fira',MUTE);
  // 3. вкладка браузера
  card(g,470,540,460,150,20,'#24211d');rr(g,490,560,260,50,12,'#3b3530');rr(g,502,573,24,24,5,BG);mark(g,505,576,18,'pixel','round');txt(g,'Qubite — Главная',536,592,'15px Fira',INK);
  rr(g,490,620,420,46,23,'#2f2b27');txt(g,'qubiteapp.ru',512,650,'15px Fira',MUTE);txt(g,'значок во вкладке (16 px — пиксели)',490,720,'16px Fira',MUTE);
  // 4. плакат
  rr(g,980,150,380,540,10,BG);g.strokeStyle='rgba(243,237,227,.2)';g.lineWidth=2;g.strokeRect(980,150,380,540);
  g.save();g.beginPath();g.rect(980,150,380,540);g.clip();g.fillStyle='rgba(243,237,227,.07)';for(let y=160;y<690;y+=14)for(let x=990;x<1360;x+=14){g.beginPath();g.arc(x,y,1.3,0,7);g.fill();}g.restore();
  mark(g,1060,220,220,'dots','round');txt(g,'qubite',1048,520,'56px T5',INK);
  txt(g,'помощник, который',1050,570,'18px Fira',MUTE);txt(g,'всё помнит',1050,596,'18px Fira',MUTE);txt(g,'qubiteapp.ru',1050,660,'15px Fira',OR);
  txt(g,'плакат',1140,720,'16px Fira',MUTE);
  // 5. стикер / футболка
  g.fillStyle=OR;g.beginPath();g.arc(1560,300,150,0,7);g.fill();mark(g,1460,200,200,'solid','round',BG,PAPER);txt(g,'стикер',1530,490,'16px Fira',MUTE);
  // футболка
  g.fillStyle='#2a2622';g.beginPath();g.moveTo(1450,560);g.lineTo(1510,530);g.quadraticCurveTo(1560,560,1610,530);g.lineTo(1670,560);g.lineTo(1700,620);g.lineTo(1660,640);g.lineTo(1660,800);g.lineTo(1460,800);g.lineTo(1460,640);g.lineTo(1420,620);g.closePath();g.fill();
  mark(g,1520,600,80,'dots','round');txt(g,'футболка',1515,840,'16px Fira',MUTE);
  // 6. логотип + надпись
  card(g,470,760,890,330,28);mark(g,520,830,190,'dots','round');txt(g,'qubite',750,960,'110px T5',INK);
  txt(g,'знак + надпись',800,1010,'16px Fira',MUTE);
};
window.icon=(mode,center)=>{const S=640,c=document.getElementById('c');c.width=c.height=S;const g=c.getContext('2d');g.fillStyle=BG;g.fillRect(0,0,S,S);mark(g,140,140,360,mode,center);};
</script></body></html>
