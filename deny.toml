# Проверка зависимостей Rust (OPS-008, D-265): `cargo deny check licenses bans sources`.
# Qubite — AGPL-3.0-only; в код не должны попадать несовместимые лицензии.
# Исключения — только явным списком ниже, каждое с комментарием «почему».

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "CC0-1.0",
    "CC-BY-4.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Исключения для отдельных крейтов: { crate = "имя", allow = ["ЛИЦЕНЗИЯ"] } — с причиной.
exceptions = [
    # Корневые сертификаты Mozilla (данные, не код) под CDLA-Permissive-2.0 — разрешающая
    # лицензия, как MIT: требует только сохранить текст. Решение D-… «агент, можно откатить».
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
