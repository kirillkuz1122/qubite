# Проверки Rust-сервера Qubite на каждый push и pull request.
name: server

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'content/english/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'content/english/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/server.yml'

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Токену CI — только чтение кода (SEC-001): проверкам писать в репозиторий не нужно.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: qubite
          POSTGRES_PASSWORD: qubite
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qubite"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://qubite:qubite@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Rust из rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование
        run: cargo fmt --all --check
      - name: Линтер
        run: cargo clippy --workspace --all-targets --locked
      - name: Тесты
        run: cargo test --workspace --locked
      - name: Сборка релиза
        run: cargo build --release --locked --bin qubite
