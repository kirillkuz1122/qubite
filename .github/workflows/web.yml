# Проверки web-приложения и TS-пакетов Qubite.
name: web

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/qubite-server/src/**'
      - 'crates/qubite-sync/fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.github/workflows/web.yml'
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

# Токену CI — только чтение кода (SEC-001): проверкам писать в репозиторий не нужно.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Зависимости
        run: pnpm install --frozen-lockfile
      - name: Форматирование
        run: pnpm format:check
      - name: Линтер
        run: pnpm lint
      - name: Типы
        run: pnpm typecheck
      - name: Unit-тесты
        run: pnpm test
      - name: Сборка
        run: pnpm build

      # Клиент API должен совпадать с описанием сервера.
      - name: Rust из rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Клиент API совпадает с сервером
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client || {
            echo "::error::Клиент API устарел: запусти 'pnpm gen:api' и закоммить изменения";
            exit 1;
          }

      - name: Браузеры Playwright
        run: pnpm --filter @qubite/web exec playwright install --with-deps firefox chromium
      - name: Браузерные тесты (Firefox и Chromium)
        run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
