# Тесты старого Qubite (legacy/qubite-v1): перенос и правки не должны его ломать.
name: legacy

on:
  push:
    branches: [main]
    paths:
      - 'legacy/**'
      - 'justfile'
      - '.github/workflows/legacy.yml'
  pull_request:
    paths:
      - 'legacy/**'

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

# Токену CI — только чтение кода (SEC-001): проверкам писать в репозиторий не нужно.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # Старый код ставится через npm; pnpm здесь не нужен.
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: 321 тест старого кода
        run: just test-legacy
