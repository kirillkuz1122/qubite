# Поиск паролей, токенов и ключей в новых коммитах.
# Старая история уже проверена вручную: найденная утечка описана в SECURITY.md.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

# Токену CI — только чтение кода (SEC-001): проверкам писать в репозиторий не нужно.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Диапазон новых коммитов
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            echo "opts=$BASE..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "opts=$BEFORE..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "opts=-1" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git --no-banner --redact --log-opts="${{ steps.range.outputs.opts }}" .
