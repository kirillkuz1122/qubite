[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Сборки для разработки занимают меньше места и собираются быстрее:
# свой код — только номера строк для трассировок, сторонние библиотеки — без отладочной информации.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 без оптимизаций считает пароль секундами — тесты входа стали бы очень медленными.
[profile.dev.package.argon2]
opt-level = 3
# Внутренний хеш Argon2. Внимание: `cargo remove` стирает эту строку (blake2 не прямая зависимость).
[profile.dev.package.blake2]
opt-level = 3

# Релиз (OPS-003): без отладочных символов — бинарник в разы меньше, удобнее для Pi.
[profile.release]
lto = "thin"
strip = "symbols"
