[package]
name = "qubite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Сервер Qubite: HTTP API, фоновые задачи, служебные команды"

[[bin]]
name = "qubite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
qubite-agent = { version = "0.1.0", path = "../qubite-agent" }
qubite-ai = { version = "0.1.0", path = "../qubite-ai" }
qubite-auth = { version = "0.1.0", path = "../qubite-auth" }
qubite-bot = { version = "0.1.0", path = "../qubite-bot" }
qubite-db = { version = "0.1.0", path = "../qubite-db" }
qubite-english = { version = "0.1.0", path = "../qubite-english" }
qubite-home = { version = "0.1.0", path = "../qubite-home" }
qubite-inbox = { version = "0.1.0", path = "../qubite-inbox" }
qubite-planner = { version = "0.1.0", path = "../qubite-planner" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-oauth = { version = "0.1.0", path = "../qubite-oauth" }
qubite-kernel = { version = "0.1.0", path = "../qubite-kernel" }
qubite-mail = { version = "0.1.0", path = "../qubite-mail" }
qubite-jobs = { version = "0.1.0", path = "../qubite-jobs" }
qubite-notify = { version = "0.1.0", path = "../qubite-notify" }
qubite-policy = { version = "0.1.0", path = "../qubite-policy" }
qubite-sync = { version = "0.1.0", path = "../qubite-sync" }
qubite-sync-server = { version = "0.1.0", path = "../qubite-sync-server" }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "uuid"] }
uuid = { version = "1.28.0", features = ["serde", "v7"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "macros"] }
futures-util = { version = "0.3.34", default-features = false }
qubite-captcha = { version = "0.1.0", path = "../qubite-captcha" }

[lints]
workspace = true

[dev-dependencies]
qubite-db = { path = "../qubite-db" }
qubite-policy = { path = "../qubite-policy" }
qubite-testkit = { path = "../qubite-testkit" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
time = { version = "0.3.55", features = ["macros"] }
base64 = "0.22"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
futures-util = "0.3.34"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
uuid = { version = "1.28.0", features = ["v4"] }
