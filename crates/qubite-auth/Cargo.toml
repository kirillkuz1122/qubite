[package]
name = "qubite-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Аккаунты, owner платформы, пароли, сессии и лимиты попыток входа"

[dependencies]
argon2 = "0.6.0"
base64 = "0.22"
getrandom = "0.4"
hex = "0.4.3"
hmac = "0.13.0"
qubite-mail = { version = "0.1.0", path = "../qubite-mail" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.3", features = ["sync", "rt", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
qubite-testkit = { path = "../qubite-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
