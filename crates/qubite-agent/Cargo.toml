[package]
name = "qubite-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Агент Qubite: инструменты с проверкой прав и таймлайн действий с откатом"

[dependencies]
qubite-ai = { version = "0.1.0", path = "../qubite-ai" }
qubite-inbox = { version = "0.1.0", path = "../qubite-inbox" }
qubite-jobs = { version = "0.1.0", path = "../qubite-jobs" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-planner = { version = "0.1.0", path = "../qubite-planner" }
qubite-policy = { version = "0.1.0", path = "../qubite-policy" }
qubite-sync = { version = "0.1.0", path = "../qubite-sync" }
qubite-sync-server = { version = "0.1.0", path = "../qubite-sync-server" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
qubite-auth = { path = "../qubite-auth" }
qubite-db = { path = "../qubite-db" }
qubite-testkit = { path = "../qubite-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
