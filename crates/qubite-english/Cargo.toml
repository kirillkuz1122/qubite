[package]
name = "qubite-english"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Английский: разговор с AI-репетитором голосом и текстом, ошибки и прогресс в памяти агента"

[dependencies]
qubite-agent = { version = "0.1.0", path = "../qubite-agent" }
qubite-ai = { version = "0.1.0", path = "../qubite-ai" }
qubite-policy = { version = "0.1.0", path = "../qubite-policy" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
qubite-auth = { path = "../qubite-auth" }
qubite-db = { path = "../qubite-db" }
qubite-testkit = { path = "../qubite-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
