[package]
name = "qubite-sync-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-sync = { version = "0.1.0", path = "../qubite-sync" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[lints]
workspace = true

[dev-dependencies]
qubite-testkit = { path = "../qubite-testkit" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
