[package]
name = "qubite-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Policy Gate: каталог модулей, гранты и единое решение доступа"

[dependencies]
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true
