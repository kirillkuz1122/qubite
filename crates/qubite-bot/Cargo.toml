[package]
name = "qubite-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Telegram-бот Qubite: мысли во Входящие и уведомления владельцу"

[dependencies]
qubite-auth = { version = "0.1.0", path = "../qubite-auth" }
qubite-inbox = { version = "0.1.0", path = "../qubite-inbox" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-oauth = { version = "0.1.0", path = "../qubite-oauth" }
qubite-policy = { version = "0.1.0", path = "../qubite-policy" }
qubite-sync = { version = "0.1.0", path = "../qubite-sync" }
qubite-sync-server = { version = "0.1.0", path = "../qubite-sync-server" }
# TLS — rustls с ring (как в qubite-ai и qubite-oauth).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.3", features = ["time", "process", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
qubite-db = { path = "../qubite-db" }
qubite-testkit = { path = "../qubite-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
