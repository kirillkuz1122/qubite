[package]
name = "qubite-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "AI-шлюз: провайдеры (OpenRouter, mock), каталог цен, лимиты, резерв бюджета, защита от prompt injection"

[dependencies]
qubite-kernel = { version = "0.1.0", path = "../qubite-kernel" }
qubite-net = { version = "0.1.0", path = "../qubite-net" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-policy = { version = "0.1.0", path = "../qubite-policy" }
# TLS — rustls с ring: без C-библиотеки aws-lc, сборка под aarch64 остаётся простой.
base64 = "0.22.1"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
# Распознавание речи в реальном времени (ElevenLabs, WebSocket); TLS — тот же rustls с ring.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.3", features = ["time", "sync", "net", "io-util", "macros", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false }
qubite-auth = { path = "../qubite-auth" }
qubite-db = { path = "../qubite-db" }
qubite-testkit = { path = "../qubite-testkit" }
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Поддельный сервер живого распознавания (WebSocket).
tokio-tungstenite = "0.29.0"

[lints]
workspace = true
