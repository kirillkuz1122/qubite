[package]
name = "qubite-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
qubite-kernel = { version = "0.1.0", path = "../qubite-kernel" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true
