[package]
name = "qubite-inbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Модуль «Входящие»: элементы, офлайн-захват через синхронизацию, место под разбор"

[dependencies]
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-parse = { version = "0.1.0", path = "../qubite-parse" }
qubite-sync = { version = "0.1.0", path = "../qubite-sync" }
qubite-sync-server = { version = "0.1.0", path = "../qubite-sync-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
qubite-testkit = { path = "../qubite-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
qubite-db = { path = "../qubite-db" }
time = { version = "0.3.55" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
