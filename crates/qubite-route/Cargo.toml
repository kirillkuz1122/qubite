[package]
name = "qubite-route"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Маршруты OSRM и поиск мест Nominatim без ключей"

[dependencies]
qubite-net = { version = "0.1.0", path = "../qubite-net" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time"] }

[dev-dependencies]
qubite-testkit = { path = "../qubite-testkit" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
