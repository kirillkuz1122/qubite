[package]
name = "qubite-home"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Главная Qubite: погода, курсы и новости из открытых источников без ключей, с кэшем; настройки виджетов"

[dependencies]
qubite-net = { version = "0.1.0", path = "../qubite-net" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["sync", "time", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
qubite-auth = { path = "../qubite-auth" }
qubite-db = { path = "../qubite-db" }
qubite-testkit = { path = "../qubite-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
