[package]
name = "qubite-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Модуль Planner: проекты и дела (шаги, важность, срок, повторения) через ядро объектов и синхронизацию"

[dependencies]
qubite-jobs = { version = "0.1.0", path = "../qubite-jobs" }
qubite-objects = { version = "0.1.0", path = "../qubite-objects" }
qubite-sync-server = { version = "0.1.0", path = "../qubite-sync-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "time", "json"] }
time = { version = "0.3.55", features = ["serde", "macros"] }
tokio = { version = "1.53.3", features = ["io-util"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

yrs = "=0.28.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
qubite-sync = { path = "../qubite-sync" }
qubite-testkit = { path = "../qubite-testkit" }
qubite-db = { path = "../qubite-db" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
