[package]
name = "qubite-captcha"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Проверка CAPTCHA: Cloudflare Turnstile и Yandex SmartCaptcha"

[dependencies]
bytes = "1"
form_urlencoded = "1.2.2"
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "webpki-roots", "http1", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
qubite-kernel = { version = "0.1.0", path = "../qubite-kernel" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net"] }
